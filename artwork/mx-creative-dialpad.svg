<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 734">
	<!-- No drawing or reference image exists, so this is drawn around the library's layout, which was measured from Logitech's top-down product photo. The face is the whole device -->
	<rect id="face" x="0" y="0" width="744" height="734" fill="none"/>

	<rect width="744" height="734" rx="72" fill="#2b2b2b"/>

	<!-- Round buttons, each in a recess -->
	<g fill="#1c1c1c">
		<circle cx="106" cy="108" r="68"/>
		<circle cx="240" cy="108" r="68"/>
		<circle cx="106" cy="614" r="68"/>
		<circle cx="629" cy="614" r="68"/>
	</g>
	<g fill="#333" stroke="#3f3f3f" stroke-width="2">
		<circle cx="106" cy="108" r="60"/>
		<circle cx="240" cy="108" r="60"/>
		<circle cx="106" cy="614" r="60"/>
		<circle cx="629" cy="614" r="60"/>
	</g>

	<!-- The roller, in its slot -->
	<rect x="458" y="66" width="205" height="86" rx="43" fill="#161616"/>
	<rect x="476" y="74" width="169" height="70" rx="12" fill="#262626"/>
	<path d="M490 76V142M504 76V142M518 76V142M532 76V142M546 76V142M560 76V142M574 76V142M588 76V142M602 76V142M616 76V142M630 76V142" stroke="#1a1a1a" stroke-width="4"/>

	<!-- The large dial, with a knurled rim -->
	<circle cx="364" cy="420" r="214" fill="#161616"/>
	<circle cx="364" cy="420" r="200" fill="#3a3a3a"/>
	<circle cx="364" cy="420" r="196" fill="none" stroke="#2a2a2a" stroke-width="8" stroke-dasharray="4 4"/>
	<circle cx="364" cy="420" r="172" fill="#2f2f2f"/>
</svg>
